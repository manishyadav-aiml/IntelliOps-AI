name: backend
on:
  push: { paths: ["backend/**", ".github/workflows/backend.yml", "data/**"] }
  pull_request: { paths: ["backend/**", ".github/workflows/backend.yml", "data/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors + pyflakes rules only)
        run: ruff check .
      - name: Tests (no Gemini key, lexical embedder, SQLite)
        run: pytest -v
