# Render blueprint (Blueprints -> New Blueprint Instance). NOT deployed or tested by the author.
# Lightweight demo mode: lexical embeddings and exact NumPy search so the service fits a small instance.
# Free-tier notes: instances sleep when idle, the free Postgres plan expires, and the container disk is
# ephemeral (uploads, models, indexes and reports are lost on redeploy unless you attach a persistent disk).
databases:
  - name: intelliops-db
    plan: free
    databaseName: intelliops
    user: intelliops

services:
  - type: web
    name: intelliops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - { key: APP_ENV, value: production }
      - { key: DEBUG, value: "false" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: intelliops-db, property: connectionString } }
      - { key: CORS_ORIGINS, sync: false }        # set to your frontend URL, e.g. https://intelliops-web.onrender.com
      - { key: EMBEDDING_MODEL, value: hashing }
      - { key: MATCHER, value: numpy }
      - { key: GEMINI_API_KEY, sync: false }       # optional; AI features stay off without it

  - type: web
    name: intelliops-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }    # e.g. https://intelliops-api.onrender.com/api/v1
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
