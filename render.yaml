# ============================================================
# INTELLIOPS-AI — RENDER DEPLOYMENT BLUEPRINT
# ============================================================
#
# Services:
#   1. FastAPI Backend (Docker)
#   2. React + Vite Frontend (Static Site)
#   3. PostgreSQL Database
#
# Region: Singapore
# Plan: Free tier
#
# IMPORTANT:
# - Free backend services may sleep when inactive.
# - Free PostgreSQL expires after 30 days.
# - Container filesystem is ephemeral.
# - Uploaded files, models, indexes and reports are not persistent.
#
# ============================================================


# ============================================================
# DATABASE
# ============================================================

databases:
  - name: intelliops-db
    plan: free
    region: singapore
    databaseName: intelliops
    user: intelliops


# ============================================================
# SERVICES
# ============================================================

services:

  # ----------------------------------------------------------
  # BACKEND — FASTAPI + DOCKER
  # ----------------------------------------------------------

  - type: web
    name: intelliops-api
    runtime: docker

    plan: free
    region: singapore

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /api/v1/health

    envVars:

      # Application configuration
      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      # Security
      - key: JWT_SECRET
        generateValue: true

      # PostgreSQL connection
      - key: DATABASE_URL
        fromDatabase:
          name: intelliops-db
          property: connectionString

      # Frontend CORS configuration
      - key: CORS_ORIGINS
        sync: false

      # Lightweight embedding configuration
      - key: EMBEDDING_MODEL
        value: hashing

      # Lightweight vector matching
      - key: MATCHER
        value: numpy

      # Optional Gemini API key
      - key: GEMINI_API_KEY
        sync: false


  # ----------------------------------------------------------
  # FRONTEND — REACT + VITE
  # ----------------------------------------------------------

  - type: web
    name: intelliops-web
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

    # React Router support
    routes:
      - type: rewrite
        source: /*
        destination: /index.html