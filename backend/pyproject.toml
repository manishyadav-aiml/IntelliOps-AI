[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Deliberately limited to syntax errors and pyflakes rules (unused imports/variables, undefined names).
# Stricter rule sets (import sorting, bugbear, pyupgrade) have NOT been run against this code base yet.
select = ["E9", "F"]
